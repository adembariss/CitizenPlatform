services:
  main-db:
    image: postgis/postgis:16-3.4
    container_name: citizenplatform-main-db
    environment:
      POSTGRES_DB: ${MAIN_DB_NAME:-citizen_platform}
      POSTGRES_USER: ${MAIN_DB_USER:-citizen_platform}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:-change-me-local}
    ports:
      - "${MAIN_DB_PORT:-5432}:5432"
    volumes:
      - main_db_data:/var/lib/postgresql/data
      - ./database/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAIN_DB_USER:-citizen_platform} -d ${MAIN_DB_NAME:-citizen_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  municipality-sample-db:
    image: postgis/postgis:16-3.4
    container_name: citizenplatform-municipality-sample-db
    environment:
      POSTGRES_DB: ${MUNICIPALITY_DB_NAME:-municipality_sample}
      POSTGRES_USER: ${MUNICIPALITY_DB_USER:-municipality_sample}
      POSTGRES_PASSWORD: ${MUNICIPALITY_DB_PASSWORD:-change-me-local}
    ports:
      - "${MUNICIPALITY_DB_PORT:-5433}:5432"
    volumes:
      - municipality_sample_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MUNICIPALITY_DB_USER:-municipality_sample} -d ${MUNICIPALITY_DB_NAME:-municipality_sample}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: citizenplatform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-citizenplatform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  main_db_data:
  municipality_sample_db_data:
  minio_data:
